name: CI

# Triggers deliberately exclude `claude/**` pushes. With 65 agent branches
# alive, every push ran the full matrix (incl. the macos-15 iOS build) and
# every red run mailed a notification that got filed as a task — the daily
# "CI失敗" loop. A branch's code is still gated: the PR event covers it once,
# instead of once per push.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Superseded runs on the same ref are pointless spend; cancel them.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    name: Analyze & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      # dart format はファイルを書き換えるので、失敗時の git diff が
      # 「期待される整形結果」そのものになる。これを出さないと、
      # ローカルに Dart が無い環境からは何が違うのか分からず、
      # 推測で直しては CI を回す消耗戦になる。
      - name: Check formatting
        run: |
          set +e
          dart format --set-exit-if-changed lib test
          STATUS=$?
          if [ "$STATUS" -ne 0 ]; then
            echo "::group::dart format が期待する差分"
            git --no-pager diff -- lib test
            echo "::endgroup::"
            {
              echo "## ❌ dart format の差分"
              echo '```diff'
              git --no-pager diff -- lib test
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit $STATUS

      - name: Analyze code
        run: flutter analyze --fatal-infos

      # Unit tests do not need the Firebase emulators — run them first so
      # the required gate is fast and independent of emulator availability.
      # flutter test streams results in completion order, so a failure that
      # happens early is buried thousands of lines above the summary. The API
      # only serves the tail of a job log, which made "N passed, 1 failed"
      # undiagnosable without re-running locally. Re-print the failures at the
      # end (and in the job summary) so the tail always answers "which test?".
      - name: Run unit tests with coverage
        run: |
          set +e
          flutter test --coverage --exclude-tags "emulator || golden" 2>&1 | tee /tmp/test.log
          STATUS=${PIPESTATUS[0]}
          if [ "$STATUS" -ne 0 ]; then
            echo "::group::失敗したテスト"
            grep -E "❌|\[E\]|Failed to load|Test failed" /tmp/test.log | head -50
            echo "::endgroup::"
            {
              echo "## ❌ 失敗したテスト"
              echo '```'
              grep -E "❌|\[E\]|Failed to load|Test failed" /tmp/test.log | head -50
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit $STATUS

      # --- Emulator-backed integration tests (best effort) -----------------
      # Everything below is continue-on-error: emulator download/startup can
      # be flaky on hosted runners and must not block the required gate.
      - name: Setup Node.js (for Firebase CLI)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java (for Firestore emulator)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Firebase CLI
        continue-on-error: true
        run: npm install -g firebase-tools

      - name: Start Firebase Emulators
        continue-on-error: true
        run: firebase emulators:start --only firestore,auth --project demo-trust-car &
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

      - name: Wait for emulators to be ready
        continue-on-error: true
        # 120s: the first run downloads the Firestore emulator jar (~60MB)
        run: npx wait-on tcp:8080 tcp:9099 --timeout 120000

      - name: Run integration tests (emulator)
        run: flutter test test/integration/ --tags emulator
        continue-on-error: true

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: coverage/lcov.info
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  storage-rules-test:
    name: Storage & Firestore Rules Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Storage Emulator は Java を必要とする。
      # firebase-tools は JDK 21 以上が必須（17 だと起動エラー）。
      - name: Setup Java (for Storage emulator)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Install rules test dependencies
        working-directory: test/rules
        run: npm install

      # npm test = firebase emulators:exec --only storage,firestore "jest --runInBand"
      # storage.rules / firestore.rules のコンパイルエラー（予約語など）もここで検出される。
      - name: Run Storage & Firestore rules tests
        working-directory: test/rules
        run: npm test

  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    needs: analyze-and-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Install Android SDK 36 and NDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | $SDKMANAGER --licenses 2>/dev/null || true
          $SDKMANAGER "platforms;android-36"
          $SDKMANAGER "ndk;28.2.13676358"
          $SDKMANAGER "build-tools;36.0.0" || echo "build-tools;36.0.0 not available, continuing"

      - name: Update android/local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          echo "flutter.sdk=$FLUTTER_ROOT" >> android/local.properties

      # google-services.json は .gitignore 対象なので CI では書き起こす。
      # 中身は APK に埋め込まれて配布されるものなので秘密ではない。
      #
      # 2026-08-23: ここに書かれていた値は実在しないアプリを指していた。
      # mobilesdk_app_id が com.example.trust_car_platform 用のもので、
      # package_name だけ jp.trustcar.app に書き換えられていた。api_key も
      # web 用だった。gradle の google-services プラグインは package_name しか
      # 照合しないためビルドは通り、実行時にだけ壊れる。
      # jp.trustcar.app の Android アプリを Firebase に登録し直し、
      # その正しい値へ差し替えた（App ID: ...:android:145b8b79b1d9e7cf80c985）。
      - name: Place google-services.json
        run: |
          cat > android/app/google-services.json <<'EOF'
          {
            "project_info": {
              "project_number": "31421119456",
              "project_id": "trust-car-platform",
              "storage_bucket": "trust-car-platform.firebasestorage.app"
            },
            "client": [{
              "client_info": {
                "mobilesdk_app_id": "1:31421119456:android:145b8b79b1d9e7cf80c985",
                "android_client_info": { "package_name": "jp.trustcar.app" }
              },
              "oauth_client": [{
                "client_id": "31421119456-1suofflbt89utameb6sjsm6eg856pkos.apps.googleusercontent.com",
                "client_type": 3
              }],
              "api_key": [{ "current_key": "AIzaSyDwjPzpdQqXFl4be7oE3n-yzcl6hoLv_Uw" }],
              "services": { "appinvite_service": { "other_platform_oauth_client": [{
                "client_id": "31421119456-1suofflbt89utameb6sjsm6eg856pkos.apps.googleusercontent.com",
                "client_type": 3
              }] } }
            }],
            "configuration_version": "1"
          }
          EOF

      - name: Build APK (debug)
        run: |
          flutter build apk --debug 2>&1 | tee /tmp/apk_build.log
          BUILD_STATUS=${PIPESTATUS[0]}
          if [ $BUILD_STATUS -ne 0 ]; then
            echo "::error::=== GRADLE FAILURE SECTION ==="
            awk '/^FAILURE:/,0' /tmp/apk_build.log | head -80 | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit $BUILD_STATUS
          fi

      - name: Locate APK (diagnostic)
        if: always()
        run: find . -name "*.apk" -type f 2>/dev/null | head -20 || echo "No APK found"

      # Build verification runs on every PR, but the binary is only kept for
      # main — per-PR APK/iOS artifacts are what pushed Actions storage over
      # quota. Re-run with workflow_dispatch if a PR binary is needed.
      - name: Upload APK artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 3
          if-no-files-found: warn

  build-ios:
    name: Build iOS
    runs-on: macos-15
    needs: analyze-and-test
    # macOS ランナーは分数が 10 倍で課金される。実測で 1 回あたり 57〜205 課金分
    # かかっており、private リポジトリ（Free = 月2,000分）なら iOS ビルド
    # 10〜15 回で月の枠を使い切る。
    # そのため PR では既定で走らせず、main への push / 手動実行 /
    # `ios` ラベル付きの PR に限定する。
    # iOS 固有の破壊を PR 段階で見たいときは PR に `ios` ラベルを付ける。
    if: >-
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'ios')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Place GoogleService-Info.plist
        run: |
          if [ -n "${{ secrets.GOOGLE_SERVICES_PLIST }}" ]; then
            echo '${{ secrets.GOOGLE_SERVICES_PLIST }}' > ios/Runner/GoogleService-Info.plist
          else
            cat > ios/Runner/GoogleService-Info.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>API_KEY</key>
            <string>AIzaSyDZQ4UK6IXiUKNJ3u1Cjup4nIEmiV97O0Q</string>
            <key>GCM_SENDER_ID</key>
            <string>31421119456</string>
            <key>PLIST_VERSION</key>
            <string>1</string>
            <key>BUNDLE_ID</key>
            <string>jp.trustcar.app</string>
            <key>PROJECT_ID</key>
            <string>trust-car-platform</string>
            <key>STORAGE_BUCKET</key>
            <string>trust-car-platform.firebasestorage.app</string>
            <key>IS_ADS_ENABLED</key>
            <false/>
            <key>IS_ANALYTICS_ENABLED</key>
            <false/>
            <key>IS_APPINVITE_ENABLED</key>
            <true/>
            <key>IS_GCM_ENABLED</key>
            <true/>
            <key>IS_SIGNIN_ENABLED</key>
            <true/>
            <key>GOOGLE_APP_ID</key>
            <string>1:31421119456:ios:4320af5d1401f02c80c985</string>
          </dict>
          </plist>
          EOF
          fi

      - name: Install CocoaPods dependencies
        working-directory: ios
        run: |
          pod install --repo-update 2>&1 | tee /tmp/pod_install.log
          INSTALL_STATUS=${PIPESTATUS[0]}
          if [ $INSTALL_STATUS -ne 0 ]; then
            tail -50 /tmp/pod_install.log | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit $INSTALL_STATUS
          fi

      - name: Build iOS (no codesign)
        run: |
          flutter build ios --no-codesign --debug --verbose 2>&1 | tee /tmp/ios_build.log
          BUILD_STATUS=${PIPESTATUS[0]}
          if [ $BUILD_STATUS -ne 0 ]; then
            echo "::error::=== XCODE ERRORS ==="
            # Xcode does not always say "error:". The failures that actually
            # stopped a build on 2026-08-21 were
            #   Command PhaseScriptExecution failed with a nonzero exit code
            #   Can't load Kernel binary: Invalid kernel binary format version
            # Neither contains "error:", so the cause never reached the log and
            # the build looked like it failed for no reason. Match those too.
            grep -E "error:|fatal error:|BUILD FAILED|Command [A-Za-z]+ failed|Can't load Kernel binary|Encountered error|linker command failed|Undefined symbol" \
              /tmp/ios_build.log | grep -v "^note:" | tail -50 | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit $BUILD_STATUS
          fi

      - name: Upload iOS artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-debug
          path: build/ios/iphoneos/
          retention-days: 3
          if-no-files-found: warn
