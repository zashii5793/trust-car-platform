name: Web Preview (Cloudflare Pages)

# Flutter Web をビルドして Cloudflare Pages に公開する。
# ブラウザ（PC/スマホ）から触れるプレビュー用。ローカル Flutter / firebase login 不要。
#
# ⚠️ 事前に一度だけ人手作業が必要（GitHub Secrets に2つ登録）:
#   Settings → Secrets and variables → Actions → New repository secret
#     - CLOUDFLARE_API_TOKEN   … Cloudflare の「Pages : Edit」権限を持つ API トークン
#     - CLOUDFLARE_ACCOUNT_ID  … Cloudflare ダッシュボードの Account ID
#   これらが無いと deploy ステップが失敗する（build までは成功する）。
#
# 公開URL: https://trust-car-platform.pages.dev/
on:
  workflow_dispatch:
  push:
    branches:
      - claude/current-status-review-052m8c
    paths:
      - 'lib/**'
      - 'web/**'
      - 'pubspec.yaml'
      - '.github/workflows/web_preview.yml'

permissions:
  contents: read

concurrency:
  group: cloudflare-pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.0'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build web
        # Cloudflare Pages はルート（*.pages.dev）で配信するため base-href は既定の "/" でよい。
        run: flutter build web --release

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # プロジェクトが無ければ作成（既存なら無視）
          npx --yes wrangler@3 pages project create trust-car-platform \
            --production-branch=main 2>/dev/null || echo "project already exists"
          # build/web をデプロイ
          npx --yes wrangler@3 pages deploy build/web \
            --project-name=trust-car-platform --branch=main
