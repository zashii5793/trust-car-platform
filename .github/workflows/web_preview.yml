name: Web Preview

# Flutter Web が **ビルドできるか** を PR / main で確かめる。公開はしない。
#
# 以前はここから GitHub Pages（zashii5793.github.io）へ出していたが、2026-08-25 に
# Pages を停止した（docs/ が丸ごと公開されていたため）。停止後も deploy ジョブが
# 残っていて、main への push のたびに赤くなっていた。
#
# テスターに配る Web 版は Firebase Hosting（https://trust-car-platform.web.app）。
# Firebase Auth の承認済みドメインに github.io が無く、Pages ではログインできない
# こともあり、公開は test_distribution.yml に一本化した。
#
# 任意のシークレット:
#   GOOGLE_MAPS_API_KEY_WEB … 地図を表示する場合に必要。未設定でもビルドは
#     通り、地図だけが出ない。web/index.html のプレースホルダを置換する。

on:
  workflow_dispatch:
  # PR では build のみ実行し、Pages へは触らない。web ビルドが通るかを
  # マージ前に確かめるためのゲート。
  pull_request:
    branches: [main]
    paths:
      - 'lib/**'
      - 'web/**'
      - 'pubspec.yaml'
      - '.github/workflows/web_preview.yml'
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'web/**'
      - 'pubspec.yaml'
      - '.github/workflows/web_preview.yml'

permissions:
  contents: read

concurrency:
  group: web-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Flutter Web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      # Google Maps のキーは web/index.html のプレースホルダを CI で置換して
      # 注入する。リポジトリにキーを置かないため。Secret 未設定でもビルドは
      # 通し、地図だけが出ない状態にする（他の画面の確認を止めないため）。
      - name: Inject Google Maps API key
        env:
          MAPS_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY_WEB }}
        run: |
          if [ -z "$MAPS_KEY" ]; then
            echo "::warning::GOOGLE_MAPS_API_KEY_WEB が未設定です。地図は表示されません。"
            exit 0
          fi
          # キーは英数字と - _ のみ。sed の区切りと衝突しない。
          sed -i "s|__GOOGLE_MAPS_API_KEY__|$MAPS_KEY|g" web/index.html
          if grep -q "__GOOGLE_MAPS_API_KEY__" web/index.html; then
            echo "::error::プレースホルダの置換に失敗しました"
            exit 1
          fi
          echo "Google Maps のキーを注入しました"

      # lib/ 配下の複数ファイルが dart:io を無条件 import しており、web ターゲット
      # ではコンパイルが通らない可能性がある。落ちた場合に「原因ファイルはどれか」を
      # ログに残す（赤いだけで原因が分からない、という状態を避ける）。
      - name: Build web
        id: build
        run: |
          set +e
          flutter build web --release \
            --dart-define=APP_BUILD_ID=${GITHUB_SHA::7} 2>&1 | tee /tmp/web_build.log
          BUILD_STATUS=${PIPESTATUS[0]}
          if [ "$BUILD_STATUS" -ne 0 ]; then
            echo "::error::=== Flutter Web ビルド失敗 ==="
            grep -E "Error:|error:" /tmp/web_build.log | head -40 | while IFS= read -r line; do
              echo "::error::$line"
            done
            {
              echo "## ❌ Flutter Web ビルド失敗"
              echo
              echo "### dart:io を import している lib/ 配下のファイル"
              echo '```'
              grep -rln "import '"'"'dart:io'"'"'" lib/ --include=*.dart || true
              echo '```'
              echo "これらを条件付き import（\`if (dart.library.io)\`）か web スタブに"
              echo "置き換える必要があるかもしれません。"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit $BUILD_STATUS

      - name: Report build size
        run: |
          {
            echo "## ✅ Flutter Web ビルド成功"
            echo
            echo "| 項目 | 値 |"
            echo "|------|-----|"
            echo "| build/web 合計 | $(du -sh build/web | cut -f1) |"
            echo "| main.dart.js | $(du -h build/web/main.dart.js 2>/dev/null | cut -f1 || echo 'n/a') |"
            echo
            echo "> ビルド検証のみ。テスターへ配るときは Actions → Test Distribution を回す。"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build as a plain artifact
        # Pages の Source 設定に関わらず成果物を取得できるようにしておく。
        uses: actions/upload-artifact@v4
        with:
          name: flutter-web-build
          path: build/web
          retention-days: 3
          if-no-files-found: warn
