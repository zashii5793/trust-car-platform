<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="trust_car_platform">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>trust_car_platform</title>
  <link rel="manifest" href="manifest.json">

  <!-- Google Maps JavaScript API.
       __GOOGLE_MAPS_API_KEY__ は CI が GOOGLE_MAPS_API_KEY_WEB の値へ
       置換する（.github/workflows/web_preview.yml 参照）。キーを
       リポジトリへ直接置かないための仕組み。
       置換されなかった場合、地図だけが出ず他の機能は動く。 -->
  <script
    src="https://maps.googleapis.com/maps/api/js?key=__GOOGLE_MAPS_API_KEY__&loading=async"
    defer></script>
</head>
<body>
  <!--
    Google Maps (Issue #43) — Web.
    google_maps_flutter_web needs the Maps JavaScript API loaded before the map
    renders. The key must be a literal here (a static file cannot read
    --dart-define), so DO NOT commit a real key. At web build/deploy time,
    inject the script below with your key (e.g. sed-replace a placeholder), then
    also pass --dart-define=MAPS_API_KEY=... so the in-app map entry appears:

    <script src="https://maps.googleapis.com/maps/api/js?key=YOUR_MAPS_API_KEY"></script>

    Without it the app still works; the map entry point is hidden and the
    distance-sorted list is used instead.
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
