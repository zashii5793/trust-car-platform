name: trust_car_platform
description: "クルマ統合管理&AIレコメンドアプリ"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # 日付ピッカーなど Material 標準 UI を日本語表示にするために必要
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.9
  flutter_dotenv: ^5.1.0
  firebase_core: 4.14.0
  firebase_auth: ^6.1.4
  cloud_firestore: ^6.9.0
  firebase_storage: ^13.0.6
  provider: ^6.1.1
  cached_network_image: ^3.3.0
  image_picker: ^1.0.5
  intl: ^0.20.2
  uuid: ^4.6.0
  google_sign_in: ^6.2.2
  sign_in_with_apple: ^6.1.0
  crypto: ^3.0.3
  google_fonts: ^6.2.1
  pdf: ^3.13.0
  printing: ^5.13.3
  share_plus: ^10.1.3
  path_provider: ^2.1.1
  # Phase 4: Offline Support
  connectivity_plus: ^6.0.3
  # Phase 4: Push Notifications
  firebase_messaging: ^16.1.1
  # v20 で initialize/show/cancel/zonedSchedule の位置引数が名前付きに
  # 変わり、v19 で uiLocalNotificationDateInterpretation が消えた。
  # 上げるときは lib/services/*_notification*・inspection_reminder_service
  # と、それらを noSuchMethod で記録しているテストを一緒に直すこと。
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.1
  # Phase 2.0: OCR機能
  google_mlkit_text_recognition: ^0.14.0
  camera: ^0.11.0+2
  image: ^4.9.2
  firebase_crashlytics: ^5.0.7
  firebase_performance: ^0.11.1+4
  # GPS / Location (Drive recording)
  geolocator: ^13.0.2
  # Maps: nearby shops map + partner pins (Issues #41/#43). Requires
  # MAPS_API_KEY at build time; the UI degrades to the distance list when the
  # key is absent.
  google_maps_flutter: ^2.10.0
  # Phase 7: BtoB Subscription (RevenueCat)
  purchases_flutter: ^8.0.0
  url_launcher: ^6.3.0
  shared_preferences: ^2.5.5
  firebase_analytics: ^12.4.1
  # AI Chat: Anthropic API
  http: ^1.2.0
  firebase_remote_config: ^6.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter
  mockito: ^5.4.4
  build_runner: ^2.4.8
  # cloud_firestore 6.7.1 で WriteBatch.update がジェネリック化された。
  # fake_cloud_firestore 4.1.1 は @override のシグネチャが旧いままで、
  # 制約 (^6.4.0) は満たすのにコンパイルが通らない。pub は検出できない
  # ので、下限をここで上げて縛る。cloud_firestore と対で動かすこと。
  fake_cloud_firestore: ^4.2.0
  # 認証状態の遷移（未ログイン→ログイン）を伴うStreamのテストに使用
  firebase_auth_mocks: ^0.15.0

flutter:
  uses-material-design: true